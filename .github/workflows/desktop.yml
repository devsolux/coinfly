name: Production desktop gates
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  # Native builds are long and use dedicated runners; queue instead of cancelling.
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned:
    name: Full production unsigned / ${{ matrix.target }}
    # Opt-in: without registered native runners these jobs would queue for 24 hours.
    if: vars.OANDAFLY_NATIVE_RUNNERS == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            labels: [self-hosted, macOS, ARM64, oandafly-xcode27-interactive]
          - target: windows-amd64
            labels: [self-hosted, Windows, X64, oandafly-desktop]
          - target: linux-amd64
            labels: [self-hosted, Linux, X64, oandafly-desktop]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 90
    env:
      OANDAFLY_BASELINE_CONFIG: ${{ vars.OANDAFLY_BASELINE_CONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synchronize existing checked locks (POSIX)
        if: runner.os != 'Windows'
        run: ./dev.sh setup
      - name: Synchronize existing checked locks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev.ps1 setup
      - name: Entire unsigned production pipeline (POSIX)
        if: runner.os != 'Windows'
        run: ./dev.sh build-unsigned
      - name: Entire unsigned production pipeline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev.ps1 build-unsigned
      - name: Upload only qualified production directories
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-unsigned-${{ matrix.target }}
          path: dist/${{ matrix.target }}/production-unsigned/
          if-no-files-found: error
      - name: Preserve failed-stage diagnostics separately
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-unverified-${{ matrix.target }}
          path: |
            build/desktop/${{ matrix.target }}/**/failed.json
            build/desktop/${{ matrix.target }}/**/preflight.json
            build/desktop/${{ matrix.target }}/**/logs/
          if-no-files-found: ignore
  signed-macos:
    name: Full production Developer ID / macOS ARM64
    # Opt-in: without registered native runners these jobs would queue for 24 hours.
    if: vars.OANDAFLY_NATIVE_RUNNERS == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    environment: oandafly-production-signing
    runs-on: [self-hosted, macOS, ARM64, oandafly-xcode27-interactive]
    timeout-minutes: 120
    env:
      # Empty values deliberately use the same Bash defaults as local builds.
      MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
      OANDAFLY_BASELINE_CONFIG: ${{ vars.OANDAFLY_BASELINE_CONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./dev.sh setup
      - run: ./dev.sh build
      - name: Upload the qualified Developer ID production directory
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-signed-macos-arm64
          path: dist/macos-arm64/production-signed/
          if-no-files-found: error
      - name: Preserve failed-stage diagnostics separately
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-unverified-macos-arm64-signed
          path: |
            build/desktop/macos-arm64/**/failed.json
            build/desktop/macos-arm64/**/preflight.json
            build/desktop/macos-arm64/**/logs/
          if-no-files-found: ignore
  sign:
    name: Sigstore keyless signatures
    needs: [unsigned, signed-macos]
    # All three unsigned targets are required; the Developer ID build is included when it qualified.
    if: ${{ !cancelled() && needs.unsigned.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Fulcio certificate bound to this workflow's OIDC identity; no long-lived key
    env:
      IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      ISSUER: https://token.actions.githubusercontent.com
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download qualified production directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: production-*
          path: release-assets
      - name: Verify per-build checksums and release version before signing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          builds=(release-assets/*/*/SHA256SUMS)
          if [ "${#builds[@]}" -lt 3 ]; then
            echo "::error::Expected at least the three qualified native builds, found ${#builds[@]}"
            exit 1
          fi
          for sums in "${builds[@]}"; do
            (cd "$(dirname "$sums")" && sha256sum --strict --check SHA256SUMS)
          done
          if [ "$EVENT" = release ]; then
            versions="$(jq -r .version release-assets/*/*/build.json | sort -u)"
            if [ "$versions" != "${TAG#v}" ]; then
              echo "::error::Release tag $TAG does not match the built version(s): $versions"
              exit 1
            fi
          fi
          cat release-assets/*/*/SHA256SUMS | sort -k2 > release-assets/SHA256SUMS-desktop
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign archives, checksums and build receipts, then verify each bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/SHA256SUMS-desktop release-assets/*/*/oandafly-*.zip release-assets/*/*/oandafly-*.tar.gz
                 release-assets/*/*/SHA256SUMS release-assets/*/*/build.json release-assets/*/*/provenance.json)
          for file in "${files[@]}"; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$file"
          done
      - name: Retain the signed production set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-signed-set
          path: release-assets/
          if-no-files-found: error
  publish-release:
    name: Attach signed builds to the published release
    needs: sign
    if: ${{ !cancelled() && github.event_name == 'release' && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # upload release assets only
    steps:
      - name: Download the signed production set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-signed-set
          path: signed
      - name: Upload archives, Sigstore bundles and combined checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in signed/SHA256SUMS-desktop signed/*/*/oandafly-*.zip signed/*/*/oandafly-*.tar.gz; do
            if [ ! -f "$file.sigstore.json" ]; then
              echo "::error::Refusing to publish $file without its Sigstore bundle"
              exit 1
            fi
          done
          assets=(signed/SHA256SUMS-desktop signed/SHA256SUMS-desktop.sigstore.json
                  signed/*/*/oandafly-*.zip signed/*/*/oandafly-*.zip.sigstore.json
                  signed/*/*/oandafly-*.tar.gz signed/*/*/oandafly-*.tar.gz.sigstore.json)
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
# These are operator-configured runner labels, not assertions that hosted images
# or the containment/baseline prerequisites exist. No job has broker credentials.
# A configured baseline transport invokes a separate interactive macOS 26.0
# runner and returns authenticated payload-bound results; missing input blocks.
# Self-hosted runners need GitHub Actions runner v2.327.0+ (Node 24 actions). Set the
# repository variable OANDAFLY_NATIVE_RUNNERS=true once they are registered.
# Source/Python release assets come from release.yml (SHA256SUMS-python).
# Release builds run on the release tag: allow tags in the signing environment's
# deployment rules. Verify assets as documented in docs/PRODUCTION_BUILD.md.
