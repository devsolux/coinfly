name: Source and Python distribution release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify source and Python distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify source manifest and committed locks
        run: python scripts/project_integrity.py --verify-manifest --require-locks
      - name: Require the release tag to match the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match project version $version"
            exit 1
          fi
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Build the deterministic source archive, sdist and wheel
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/package_source.py --require-locks --output "dist/release/oandafly-$version-source.zip"
          rm "dist/release/oandafly-$version-source.zip.sha256"
          git diff --exit-code -- PACKAGE_MANIFEST.json
          python -m build --sdist --wheel --outdir dist/release
          python scripts/check_distribution.py "dist/release/oandafly-$version.tar.gz" "dist/release/oandafly-$version-py3-none-any.whl"
          (cd dist/release && sha256sum oandafly-* > SHA256SUMS-python && cat SHA256SUMS-python)
      - name: Retain the verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-release
          path: dist/release/
          if-no-files-found: error
  sign:
    name: Sigstore keyless signatures
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Fulcio certificate bound to this workflow's OIDC identity; no long-lived key
    env:
      IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release
          path: release
      - name: Re-check distribution checksums
        run: cd release && sha256sum --strict --check SHA256SUMS-python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign every distribution and the checksum file, then verify each bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in release/oandafly-* release/SHA256SUMS-python; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$file"
          done
      - name: Retain the signed distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-release-signed
          path: release/
          if-no-files-found: error
  publish-release:
    name: Attach signed distributions to the published release
    needs: sign
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets only
    steps:
      - name: Download the signed distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-release-signed
          path: signed
      - name: Upload distributions, Sigstore bundles and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in signed/oandafly-* signed/SHA256SUMS-python; do
            case "$file" in *.sigstore.json) continue ;; esac
            if [ ! -f "$file.sigstore.json" ]; then
              echo "::error::Refusing to publish $file without its Sigstore bundle"
              exit 1
            fi
          done
          gh release upload "$TAG" signed/* --repo "$GITHUB_REPOSITORY" --clobber
# Runs on GitHub-hosted runners, independent of the native desktop builds. Manual
# dispatch builds and signs without publishing; a published release attaches the
# source archive, sdist, wheel, SHA256SUMS-python and a .sigstore.json per file.
