# CI validates source contracts. It does not sign, publish, enable live orders,
# certify regional eligibility or substitute for native release evidence.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.1"
  PYTHON_VERSION: "3.14.8"
  # Use uv-managed CPython on every runner. A preinstalled runner Python can link
  # an older SQLite (the Windows python.org build ships 3.50.4) than the 3.51.3
  # minimum; uv's managed builds bundle a current one.
  UV_MANAGED_PYTHON: "1"

jobs:
  contracts:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no floating major tags)
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked --extra desktop --extra research --extra training
      - name: Verify linked SQLite requirement
        run: uv run python -c "import sqlite3; assert sqlite3.sqlite_version_info >= (3,51,3), sqlite3.sqlite_version"
      - name: Lint
        run: uv run ruff check src tests scripts packaging dev.py
      - name: Type-check
        run: uv run mypy src/coinfly
      - name: Test
        run: uv run python -m pytest -q
      - name: Verify fail-closed doctor diagnostics
        run: uv run python scripts/verify_doctor.py
      - name: Build wheel and sdist
        run: uv build --no-sources
      - name: Inspect wheel payload
        run: uv run python scripts/verify_artifact.py
      - name: Compile macOS ARM64 native sources with vault access disabled
        if: runner.os == 'macOS'
        run: |
          cmake -S native -B build/native -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/native --config Release
      - name: Compile Linux AMD64 neural sources
        if: runner.os == 'Linux'
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target coinfly_neural --config Release
      - name: Compile Windows AMD64 native sources with vault access disabled
        if: runner.os == 'Windows'
        run: |
          cmake -S native -B build/native -A x64
          cmake --build build/native --config Release

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0 (no floating major tags)
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked --extra desktop --extra research --extra training
      - name: Audit installed packages
        run: uv run pip-audit --local --skip-editable

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint and shellcheck over every workflow
        # The author's image (bundles shellcheck); reads .github/actionlint.yaml for runner labels.
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
