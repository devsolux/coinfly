[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coinfly"
version = "1.0.0"
description = "Evidence-bound desktop trading research with durable accounting and isolated execution realms"
authors = [{name = "devsolux"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "cryptography==50.0.1",
  "certifi==2026.7.22",
]

[project.optional-dependencies]
desktop = [
    "customtkinter==6.0.0",
    "keyring==25.7.0",
]
research = ["numpy==2.4.6", "pandas==3.0.5", "pyarrow==25.0.1", "Pillow==12.3.0"]
training = [
    "numba==0.67.0",
    "optuna==5.0.0",
    "polars==1.44.2",
]

[project.scripts]
coinfly = "coinfly.cli:main"
coinfly-worker = "coinfly.cli:worker_main"

[dependency-groups]
dev = ["ruff>=0.14", "mypy>=1.19", "build>=1.4", "pytest>=9.1", "pip-audit>=2.9"]
release = [
    "pyinstaller==6.22.3",
]

[tool.coinfly]
application-id = "com.devsolux.coinfly"
publisher = "devsolux"
minimum-sqlite-version = "3.51.3"
native-targets = ["macos-arm64", "windows-amd64", "linux-amd64"]
live-certified = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["coinfly*"]

[tool.setuptools.package-data]
coinfly = ["py.typed", "storage/schema.sql", "research/manifests/*.json", "research/neural/kernel.cpp", "bootstrap/publisher/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/coinfly"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["customtkinter.*", "numpy.*", "pandas.*", "pyarrow.*", "PIL.*"]
ignore_missing_imports = true
